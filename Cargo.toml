[package]
name = "sql-tdg"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Generate deterministic test data for SQL workloads from semantic constraints"
repository = "https://github.com/phdah/sql-tdg"
readme = "README.md"
keywords = ["sql", "testing", "test-data", "arrow", "dbt"]

[lib]
path = "src/lib.rs"

[dependencies]
arrow-array = "60"
arrow-csv = "60"
arrow-ord = "60"
arrow-schema = "60"
chrono = { version = "0.4", default-features = false, features = ["std"] }
parquet = { version = "60", default-features = false, features = ["arrow"] }
rand_chacha = "0.10"
rand_core = "0.10"
sql-semantic-protocol = { version = "2.0.3", default-features = false }

[dev-dependencies]
duckdb = "~1.10506.0"
