name: Rust checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DUCKDB_DOWNLOAD_LIB: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Run Rust checks
        run: make rust-checks

      - name: Install dbt end-to-end dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements-dbt-e2e.txt

      - name: Run dbt end-to-end workflow
        run: make dbt-e2e
