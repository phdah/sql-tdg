name: Verify TASK-34 release links

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-links:
    name: Verify published badges and docs
    runs-on: ubuntu-latest
    steps:
      - name: Verify published version, Rust API docs, and badges
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local url="$1"
            local output="$2"
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              --output "$output" "$url"
          }

          fetch "https://index.crates.io/sq/l-/sql-tdg" crate.jsonl
          grep -q '"vers":"1.0.0"' crate.jsonl
          echo "Cargo sparse index: sql-tdg 1.0.0 published"

          fetch "https://docs.rs/sql-tdg/1.0.0/sql_tdg/" docs.html
          grep -qi 'sql_tdg' docs.html
          echo "docs.rs: published 1.0.0 Rust API documentation available"

          fetch "https://docs.rs/sql-tdg/badge.svg" docs.svg
          grep -qi 'docs.rs' docs.svg
          if grep -Eqi '(build failed|failed to build|not found)' docs.svg; then
            echo "docs.rs badge indicates a build failure"
            exit 1
          fi
          echo "docs.rs badge: available"

          fetch "https://img.shields.io/crates/v/sql-tdg.svg?cacheSeconds=300" version.svg
          grep -q '1.0.0' version.svg
          echo "crates.io badge: displays 1.0.0"

          fetch "https://github.com/phdah/sql-tdg/actions/workflows/rust-checks.yml/badge.svg?branch=main" ci.svg
          if ! grep -Eqi '(passing|success)' ci.svg; then
            echo "Default branch CI badge does not show a successful run"
            head -c 600 ci.svg
            exit 1
          fi
          echo "main CI badge: passing"
