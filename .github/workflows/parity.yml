name: Go Rust parity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Run parity
        run: make parity
